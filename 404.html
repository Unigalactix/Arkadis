<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Arkadis</title>
    <link rel="icon" type="image/png" href="legacy/logo.png">
    <style>
        @font-face {
            font-family: 'ARKFONT';
            src: url('legacy/ARKFONT-Regular.ttf') format('truetype');
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #eef2f7;
            background:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                #05070a;
            background-size: 48px 48px;
            font-family: 'ARKFONT', serif;
        }

        main {
            width: min(92vw, 42rem);
            text-align: center;
        }

        video {
            width: min(62vw, 20rem);
            max-height: 40vh;
            aspect-ratio: 1;
            object-fit: contain;
            filter: drop-shadow(0 18px 48px rgba(0, 0, 0, 0.65));
        }

        .status {
            margin: -0.75rem 0 0.5rem;
            color: #d8b66f;
            font-size: clamp(3rem, 10vw, 5.5rem);
            line-height: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 2.25rem);
            letter-spacing: 0.08em;
        }

        p {
            max-width: 30rem;
            margin: 1rem auto 1.75rem;
            color: #aab5c4;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            align-items: center;
            min-height: 2.75rem;
            padding: 0.7rem 1.1rem;
            border: 1px solid rgba(216, 182, 111, 0.34);
            border-radius: 8px;
            color: #eef2f7;
            background: rgba(216, 182, 111, 0.09);
            text-decoration: none;
            transition: border-color 180ms ease, background 180ms ease;
        }

        a:hover,
        a:focus-visible {
            border-color: rgba(216, 182, 111, 0.72);
            background: rgba(216, 182, 111, 0.15);
            outline: none;
        }
    </style>
</head>

<body>
    <main>
        <video autoplay muted loop playsinline preload="auto" aria-label="Arkadis rotating logo">
            <source src="legacy/rotate_logo_3d.mp4" type="video/mp4">
        </video>
        <div class="status">404</div>
        <h1>Archive coordinates not found</h1>
        <p>The requested location does not exist in the Arkadis network or your clearance route has expired.</p>
        <a href="./index.html">&larr;&nbsp; Return to Arkadis</a>
    </main>
</body>

</html>
